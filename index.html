<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Clock</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #181818;
    --card-lower: #141414;
    --digit: var(--accent, #cfcfcf);
    --divider: rgba(0, 0, 0, 0.55);
    --colon: #3a3a3a;
    --panel-bg: #1c1c1c;
    --panel-text: #b5b5b5;
    --panel-border: #2c2c2c;
    --btn-bg: #262626;
    --btn-hover: #303030;
    --shadow: rgba(0, 0, 0, 0.5);
  }
  :root.light {
    --bg: #d8d8d4;
    --card: #ececea;
    --card-lower: #e2e2e0;
    --digit: var(--accent-light, #2a2a2a);
    --divider: rgba(0, 0, 0, 0.12);
    --colon: #9a9a96;
    --panel-bg: #efefec;
    --panel-text: #444;
    --panel-border: #c8c8c4;
    --btn-bg: #dfdfdb;
    --btn-hover: #d2d2ce;
    --shadow: rgba(0, 0, 0, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .clock {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: min(3vw, 5vh);
  }

  .card {
    position: relative;
    width: min(42vw, 78vh);
    height: min(42vw, 78vh);
    border-radius: min(2.5vw, 4vh);
    box-shadow: 0 min(0.8vh, 6px) min(3vh, 24px) var(--shadow);
    perspective: 1200px;
  }
  /* middle divider line, like a flip clock hinge */
  .card::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: min(0.5vh, 4px);
    transform: translateY(-50%);
    background: var(--divider);
    z-index: 3;
  }

  .half {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
  }
  .half.top, .flap-top {
    top: 0;
    background: var(--card);
    border-radius: min(2.5vw, 4vh) min(2.5vw, 4vh) 0 0;
  }
  .half.bottom, .flap-bottom {
    bottom: 0;
    background: var(--card-lower);
    border-radius: 0 0 min(2.5vw, 4vh) min(2.5vw, 4vh);
  }
  .half span {
    position: absolute;
    left: 0;
    width: 100%;
    height: 200%; /* full card height; the half crops it */
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(32vw, 60vh);
    font-weight: 600;
    line-height: 1;
    color: var(--digit);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .half.top span, .flap-top span { top: 0; }
  .half.bottom span, .flap-bottom span { top: -100%; }

  /* flip flaps: hidden except during the once-a-minute flip */
  .flap {
    display: none;
    z-index: 2;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .flap-top { transform-origin: center bottom; }
  .flap-bottom { transform-origin: center top; transform: rotateX(90deg); }
  .card.flipping .flap { display: block; }
  .card.flipping .flap-top { animation: flip-top 0.6s ease-in both; }
  .card.flipping .flap-bottom { animation: flip-bottom 0.6s ease-out both; }

  @keyframes flip-top {
    0%        { transform: rotateX(0); }
    50%, 100% { transform: rotateX(-90deg); }
  }
  @keyframes flip-bottom {
    0%, 50%   { transform: rotateX(90deg); }
    100%      { transform: rotateX(0); }
  }

  .colon {
    display: flex;
    flex-direction: column;
    gap: min(4vw, 8vh);
    /* flash once every 2 seconds — pure CSS, no JS timer */
    animation: blink 2s step-end infinite;
  }
  .colon span {
    width: min(2.2vw, 4vh);
    height: min(2.2vw, 4vh);
    border-radius: 50%;
    background: var(--colon);
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.15; }
  }

  @media (prefers-reduced-motion: reduce) {
    .colon { animation: none; }
    .card.flipping .flap { display: none; }
  }

  /* ---- settings ---- */
  .gear {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: var(--btn-bg);
    color: var(--panel-text);
    font-size: 20px;
    cursor: pointer;
    opacity: 0.25;
  }
  .gear:hover, .gear:focus-visible { opacity: 1; }

  .panel {
    position: fixed;
    bottom: 74px;
    right: 20px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 16px;
    width: 220px;
    color: var(--panel-text);
    font-size: 13px;
    box-shadow: 0 8px 30px var(--shadow);
    display: none;
    z-index: 10;
  }
  .panel.open { display: block; }
  .panel h3 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
    opacity: 0.7;
  }
  .panel section + section { margin-top: 14px; }

  .swatches { display: flex; gap: 8px; }
  .swatch {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
  }
  .swatch.active { border-color: var(--panel-text); }

  .row-btn {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    background: var(--btn-bg);
    color: var(--panel-text);
    font-size: 13px;
    cursor: pointer;
    text-align: left;
  }
  .row-btn:hover { background: var(--btn-hover); }
</style>
</head>
<body>

<main class="clock">
  <div class="card" id="card-hh">
    <div class="half top"><span>--</span></div>
    <div class="half bottom"><span>--</span></div>
    <div class="half flap flap-top"><span>--</span></div>
    <div class="half flap flap-bottom"><span>--</span></div>
  </div>
  <div class="colon" aria-hidden="true"><span></span><span></span></div>
  <div class="card" id="card-mm">
    <div class="half top"><span>--</span></div>
    <div class="half bottom"><span>--</span></div>
    <div class="half flap flap-top"><span>--</span></div>
    <div class="half flap flap-bottom"><span>--</span></div>
  </div>
</main>

<button class="gear" id="gear" aria-label="Settings" title="Settings">&#9881;</button>

<div class="panel" id="panel">
  <section>
    <h3>Color</h3>
    <div class="swatches" id="swatches"></div>
  </section>
  <section>
    <h3>Appearance</h3>
    <button class="row-btn" id="modeBtn">Switch to light mode</button>
  </section>
  <section>
    <h3>Display</h3>
    <button class="row-btn" id="fsBtn">Fullscreen (F)</button>
  </section>
</div>

<script>
(function () {
  "use strict";

  function makeCard(id) {
    var card = document.getElementById(id);
    var spans = card.getElementsByTagName("span");
    var c = {
      card: card,
      top: spans[0],
      bottom: spans[1],
      flapTop: spans[2],
      flapBottom: spans[3],
      value: null
    };
    card.addEventListener("animationend", function (e) {
      if (e.animationName === "flip-bottom") {
        c.bottom.textContent = c.value;
        card.classList.remove("flipping");
      }
    });
    return c;
  }

  function setValue(c, val) {
    if (c.value === val) return;
    var old = c.value;
    c.value = val;
    // No animation on first render or in a hidden tab
    if (old === null || document.hidden) {
      c.card.classList.remove("flipping");
      c.top.textContent = val;
      c.bottom.textContent = val;
      return;
    }
    // Top half shows the new value immediately; the top flap (old value)
    // folds down over it, then the bottom flap (new value) folds into place.
    c.flapTop.textContent = old;
    c.flapBottom.textContent = val;
    c.top.textContent = val;
    c.bottom.textContent = old;
    c.card.classList.remove("flipping");
    void c.card.offsetWidth; // restart animation if one was in progress
    c.card.classList.add("flipping");
  }

  var cardHH = makeCard("card-hh");
  var cardMM = makeCard("card-mm");
  var timer = null;

  function render() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    setValue(cardHH, (h < 10 ? "0" : "") + h);
    setValue(cardMM, (m < 10 ? "0" : "") + m);
  }

  // Update once per minute: sleep until the next minute boundary, no polling.
  function schedule() {
    var now = Date.now();
    var wait = 60000 - (now % 60000) + 50; // +50ms guard past the boundary
    timer = setTimeout(function () {
      render();
      schedule();
    }, wait);
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      clearTimeout(timer);
      timer = null;
    } else {
      render();
      schedule();
    }
  });

  render();
  schedule();

  /* ---- settings ---- */
  var THEMES = [
    { name: "default", dark: "#cfcfcf", light: "#2a2a2a" },
    { name: "amber",   dark: "#d4a24e", light: "#8a5f14" },
    { name: "green",   dark: "#7fbf7f", light: "#2e6b2e" },
    { name: "cyan",    dark: "#6cb8c4", light: "#1f6570" },
    { name: "rose",    dark: "#c98a96", light: "#8c3b4a" },
    { name: "violet",  dark: "#a48ec9", light: "#5b3f8c" }
  ];
  var STORE_KEY = "flipclock-prefs";
  var prefs = { theme: "default", light: false };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved && typeof saved === "object") {
      if (typeof saved.theme === "string") prefs.theme = saved.theme;
      if (typeof saved.light === "boolean") prefs.light = saved.light;
    }
  } catch (e) { /* corrupted or unavailable storage: use defaults */ }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(prefs)); } catch (e) {}
  }

  var root = document.documentElement;
  var modeBtn = document.getElementById("modeBtn");
  var swatchesEl = document.getElementById("swatches");

  function applyPrefs() {
    var t = THEMES[0];
    for (var i = 0; i < THEMES.length; i++) {
      if (THEMES[i].name === prefs.theme) { t = THEMES[i]; break; }
    }
    root.style.setProperty("--accent", t.dark);
    root.style.setProperty("--accent-light", t.light);
    root.classList.toggle("light", prefs.light);
    modeBtn.textContent = prefs.light ? "Switch to dark mode" : "Switch to light mode";
    var btns = swatchesEl.children;
    for (var j = 0; j < btns.length; j++) {
      btns[j].classList.toggle("active", btns[j].dataset.theme === prefs.theme);
    }
  }

  THEMES.forEach(function (t) {
    var b = document.createElement("button");
    b.className = "swatch";
    b.dataset.theme = t.name;
    b.style.background = t.dark;
    b.title = t.name;
    b.setAttribute("aria-label", "Color: " + t.name);
    b.addEventListener("click", function () {
      prefs.theme = t.name;
      save();
      applyPrefs();
    });
    swatchesEl.appendChild(b);
  });

  modeBtn.addEventListener("click", function () {
    prefs.light = !prefs.light;
    save();
    applyPrefs();
  });

  applyPrefs();

  /* panel open/close */
  var gear = document.getElementById("gear");
  var panel = document.getElementById("panel");
  gear.addEventListener("click", function (e) {
    e.stopPropagation();
    panel.classList.toggle("open");
  });
  panel.addEventListener("click", function (e) { e.stopPropagation(); });
  document.addEventListener("click", function () {
    panel.classList.remove("open");
  });

  /* fullscreen */
  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    }
  }
  document.getElementById("fsBtn").addEventListener("click", toggleFullscreen);
  document.addEventListener("dblclick", toggleFullscreen);
  document.addEventListener("keydown", function (e) {
    if (e.key === "f" || e.key === "F") toggleFullscreen();
  });
})();
</script>
</body>
</html>
